[package]
name = "cybernest"
version = "1.0.0"
description = "CyberNest - Security Tools Desktop Hub"
authors = ["CyberNest Team"]
edition = "2021"

[lib]
name = "cybernest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
