<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberNest - 桌面端高保真原型交互预览中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070A0F;
      --panel-dark: #0F172A;
      --card-dark: #1E293B;
      --border-dark: #334155;
      --accent-cyan: #0EA5E9;
      --accent-green: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* Top Hub Header */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-dark);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1E293B;
      color: #38BDF8;
      border: 1px solid rgba(14, 165, 233, 0.4);
    }
    /* Page Nav Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      background: #0B0F17;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #1E293B;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      color: #F8FAFC;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: #0EA5E9;
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }
    /* Zoom & Fullscreen Controls */
    .control-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ctrl-btn {
      background: #1E293B;
      border: 1px solid #334155;
      color: #CBD5E1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover {
      background: #334155;
      color: #FFFFFF;
    }
    /* Prototype Stage */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }
    .stage-container {
      width: 100%;
      max-width: 1280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(51, 65, 85, 0.6);
      background: #0B0F17;
      display: flex;
      justify-content: center;
    }
    .stage-container img, .stage-container object {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 1280 / 800;
    }
    /* Info Card */
    .info-bar {
      max-width: 1280px;
      width: 100%;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94A3B8;
    }
    .info-bar strong {
      color: #F8FAFC;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 6v6c0 6 4.5 11.5 9 12 4.5-.5 9-6 9-12V6l-9-4z" fill="#0EA5E9" fill-opacity="0.2" stroke="#0EA5E9" stroke-width="2"/>
        <path d="M8 12l3 3 6-6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <strong style="font-size: 15px; letter-spacing: 0.5px;">CyberNest</strong>
      <span class="badge">PROTOTYPE HUB</span>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('01_dashboard.svg', this, '1. 首页 (Dashboard) - 高频安全工具秒级作战台')">1. 首页 Dashboard</button>
      <button class="tab-btn" onclick="switchTab('02_all_tools.svg', this, '2. 全部工具 (All Tools) - 48款资产卡片/列表双模矩阵')">2. 全部工具</button>
      <button class="tab-btn" onclick="switchTab('03_categories.svg', this, '3. 分类与标签管理 (Taxonomy Studio) - 8大层级与24个标签')">3. 分类与标签管理</button>
      <button class="tab-btn" onclick="switchTab('04_add_edit_tool.svg', this, '4. 添加/编辑工具 (Tool Studio) - 独立沉浸式工作台与实时卡片预览')">4. 添加/编辑工具</button>
      <button class="tab-btn" onclick="switchTab('05_settings.svg', this, '5. 系统设置 (Settings) - 本地SQLite安全备份、外观与全局召唤')">5. 系统设置</button>
    </nav>

    <div class="control-tools">
      <button class="ctrl-btn" onclick="openRawSvg()">在新标签页查看原始 SVG</button>
    </div>
  </header>

  <main>
    <div class="stage-container">
      <img id="protoView" src="01_dashboard.svg" alt="CyberNest Prototype Screen">
    </div>

    <div class="info-bar">
      <div id="pageDesc">
        <strong>当前视窗:</strong> 1. 首页 (Dashboard) - 高频安全工具秒级作战台 (标准分辨率 1280 x 800)
      </div>
      <div>
        技术底座: <span class="badge">Tauri 2.0</span> + <span class="badge">React 18</span> + <span class="badge">Tailwind CSS</span>
      </div>
    </div>
  </main>

  <script>
    let currentSvg = '01_dashboard.svg';

    function switchTab(svgFile, btn, desc) {
      currentSvg = svgFile;
      document.getElementById('protoView').src = svgFile;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('pageDesc').innerHTML = '<strong>当前视窗:</strong> ' + desc + ' (标准分辨率 1280 x 800)';
    }

    function openRawSvg() {
      window.open(currentSvg, '_blank');
    }
  </script>
</body>
</html>
